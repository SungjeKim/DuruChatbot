name: Daily Duruchatbot Backup

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 한국시간 새벽 3시 (UTC 18시)
  workflow_dispatch:        # 수동 실행 허용

permissions:
  contents: write           # GitHub에 푸시 권한

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare export folder
        run: mkdir -p exports

      - name: Set timestamp
        id: stamp
        run: echo "ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Power Platform WhoAmI
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ secrets.https://org033068cf.crm5.dynamics.com }}
          tenant-id: ${{ secrets.f9230b9b-e666-42ce-83be-aa6deb0f78b4 }}
          client-id: ${{ secrets.8c8bf3b2-4325-4a35-96d6-a57a8aea2e8a }}

      - name: Export Solution (Unmanaged)
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.PP_ENV_URL }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          client-id: ${{ secrets.PP_CLIENT_ID }}
          solution-name: Duruchatbot
          solution-output-file: exports/Duruchatbot_backup_${{ steps.stamp.outputs.ts }}.zip
          managed: false

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit files
        run: |
          git add exports/
          git commit -m "Auto backup: ${{ steps.stamp.outputs.ts }}" || echo "Nothing to commit"

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
