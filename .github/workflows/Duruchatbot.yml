name: DurumeHRBackup

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 KST(Asia/Seoul) 새벽 3시쯤 실행 (UTC 18시)
  workflow_dispatch:        # 수동 실행 버튼도 켜두기

permissions:
   contents: write           # 푸시 권한 필수

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare export folder
        run: mkdir -p exports

      # (선택) 버전 파일명 쓰고 싶으면 아래 주석 해제
      # - name: Set timestamp
      #   id: stamp
      #   run: echo "ts=$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      # 마이크로소프트 공식 Power Platform 액션들 (pac CLI 래핑)
      - name: Power Platform WhoAmI
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ secrets.PP_ENV_URL }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          client-id: ${{ secrets.PP_CLIENT_ID }}

      - name: Export Solution (Unmanaged)
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.PP_ENV_URL }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          client-id: ${{ secrets.PP_CLIENT_ID }}
          solution-name: ChatbotBackup    # ← Copilot Studio 솔루션명과 동일해야 함
          solution-output-file: exports/ChatbotBackup-latest.zip
          managed: false

     # (선택) 버전 파일명으로도 복사해 보관
      # - name: Copy to versioned filename
      #   run: cp exports/ChatbotBackup-latest.zip exports/ChatbotBackup-${{ steps.stamp.outputs.ts }}.zip

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit files
        run: |
          git add exports/
          git commit -m "Auto backup: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "Nothing to commit"

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
